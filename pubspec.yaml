name: agri_mart
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.7.1
  dotted_border: ^3.1.0
  firebase_auth: ^6.5.6
  firebase_core: ^4.11.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2
  intl: ^0.20.3
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  flutter_native_splash: ^2.4.8
  firebase_storage: ^13.4.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/agrimart_logo.png"
  min_sdk_android: 21 